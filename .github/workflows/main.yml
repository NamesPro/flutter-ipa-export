name: Build TIPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          architecture: x64
          
      - run: flutter pub get

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - run: mkdir -p Payload
        working-directory: build/ios/iphoneos

      - run: cp -R Runner.app Payload/
        working-directory: build/ios/iphoneos

      - name: Zip to TIPA
        run: zip -qq -r -9 Standoff2_Injector.tipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Standoff2_Injector
          path: build/ios/iphoneos/Standoff2_Injector.tipa
          if-no-files-found: error
