name: Build Unsigned IPA (Standoff2 Injector)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ⬇️ УДАЛИЛИ ЭТОТ ШАГ ⬇️
      # - name: Generate code
      #   run: dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA from archive
        run: |
          mkdir -p Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Standoff2_Injector.tipa

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standoff2_Injector
          path: Standoff2_Injector.tipa
          if-no-files-found: error
