name: Build TIPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Disable automatic codesigning
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get

      # Сборка для симулятора (не требует подписи)
      - run: flutter build ios --release --simulator --no-codesign

      - run: |
          mkdir -p Payload
          cp -R build/ios/iphonesimulator/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Standoff2_Injector.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: Standoff2_Injector
          path: Standoff2_Injector.tipa
